services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: dataplat
      POSTGRES_PASSWORD: dataplat
      POSTGRES_DB: dataplat
    ports:
      - "5432:5432"
    volumes:
      - dataplat_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  dataplat_pg:
